<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ego WM · 工作台可用性试验</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./a1.js"></script>
</head>
<body>
  <header class="masthead"><div class="mast-inner"><a class="brand" href="./">Ego WM</a></div></header>
  <main class="trial-intro">
    <h1>工作台可用性试验</h1>
    <p>按网页带出的顺序审阅 16 条短片。遇到选项与看到的情况对不上时，可以记录问题。做完导出一份文件交回组织者。</p>
    <label>分配给你的编号
      <select id="trial-reviewer"><option value="">选择编号</option><option>R1</option><option>R2</option></select>
    </label>
    <p id="trial-progress" role="status"></p>
    <div class="trial-actions">
      <button class="primary" id="trial-start" type="button">开始审阅</button>
      <button class="secondary" id="trial-export" type="button" disabled>导出试验记录</button>
    </div>
    <p><a href="./review/ATTRIBUTION.md">示范来源与许可证</a></p>
  </main>
</body>
</html>
